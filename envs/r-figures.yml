# R environment used to render the manuscript figures (Rscript scripts/figures.R).
# Versions are those installed when the published figures were rendered; the
# rendering libraries (ragg, systemfonts, textshaping) affect pixel output.
name: vaginal-virbench-figures
channels:
  - conda-forge
dependencies:
  - r-base=4.3.3
  - r-ggplot2=3.5.2
  - r-patchwork=1.3.2
  - r-optparse=1.7.5
  - r-dplyr=1.1.4
  - r-tidyr=1.3.1
  - r-readr=2.1.5
  - r-scales=1.4.0
  - r-tibble=3.3.0
  - r-ggplotify=0.1.3
  - r-pheatmap=1.0.13
  - r-rcolorbrewer=1.1_3
  - r-reshape2=1.4.4
  - r-ggrepel=0.9.6
  - r-ragg=1.5.0
  - r-systemfonts=1.2.3
  - r-textshaping=1.0.3
